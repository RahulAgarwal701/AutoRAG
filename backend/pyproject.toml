[project]
name = "autorag-backend"
version = "0.1.0"
description = "AutoRAG API and ingestion worker"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2",
    "anthropic>=0.75,<1",
    "argon2-cffi>=23.1,<26",
    "asyncpg>=0.29,<1",
    "boto3>=1.35,<2",
    "beautifulsoup4>=4.12,<5",
    "cohere>=5.13,<6",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "fastembed>=0.4,<1",
    "filelock>=4.2.1",
    "google-genai>=1.0,<2",
    "gunicorn>=23,<24",
    "httpx>=0.27,<1",
    "langchain-google-genai>=2.0,<3",
    "langfuse>=2.50,<4",
    "langgraph>=0.2,<2",
    "openai>=1.54,<3",
    "pdfminer-six>=20231228",
    "pillow>=13.0.0",
    "pymupdf>=1.24,<2",
    "pydantic-settings>=2.5,<3",
    "pyjwt>=2.9,<3",
    "python-multipart>=0.0.12,<1",
    "python-docx>=1.1,<2",
    "qdrant-client>=1.12,<2",
    "ragas>=0.3.9,<0.4",
    "redis>=5,<7",
    "sentry-sdk[fastapi]>=2,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "temporalio>=1.7,<2",
    "tiktoken>=0.8,<1",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20,<1",
    "mypy>=1.18,<2",
    "pip-audit>=2.9,<3",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.7,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["migrations/"]

# SDKs with dynamic overloads expose types that are narrower than their supported
# runtime inputs. Keep these exceptions local so the rest of the application stays
# under strict checking.
[[tool.mypy.overrides]]
module = "app.workflows.connection"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "app.public.rate_limit"
disable_error_code = ["arg-type", "misc"]

[[tool.mypy.overrides]]
module = "app.agents.tools"
disable_error_code = ["operator", "return-value"]

[[tool.mypy.overrides]]
module = "app.services.embeddings"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "app.services.retrieval"
disable_error_code = ["call-overload"]

[[tool.mypy.overrides]]
module = "app.agents.llm"
disable_error_code = ["arg-type", "list-item", "typeddict-item", "union-attr"]

[[tool.mypy.overrides]]
module = "app.agents.graph"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "app.agents.service"
disable_error_code = ["assignment", "call-overload", "index", "union-attr"]

[[tool.mypy.overrides]]
module = "app.api.routes.public"
disable_error_code = ["arg-type", "dict-item"]

[[tool.mypy.overrides]]
module = "app.services.evaluation"
disable_error_code = ["arg-type", "call-overload", "union-attr"]

[[tool.mypy.overrides]]
module = "app.main"
disable_error_code = ["arg-type", "return-value"]

