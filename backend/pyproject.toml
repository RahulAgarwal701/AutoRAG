[project]
name = "autorag-backend"
version = "0.1.0"
description = "AutoRAG API and ingestion worker"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2",
    "anthropic>=0.75,<1",
    "argon2-cffi>=23.1,<26",
    "asyncpg>=0.29,<1",
    "boto3>=1.35,<2",
    "beautifulsoup4>=4.12,<5",
    "cohere>=5.13,<6",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "fastembed>=0.4,<1",
    "google-genai>=1.0,<2",
    "httpx>=0.27,<1",
    "langfuse>=2.50,<4",
    "langgraph>=0.2,<2",
    "openai>=1.54,<3",
    "pdfminer-six>=20231228",
    "pymupdf>=1.24,<2",
    "pydantic-settings>=2.5,<3",
    "pyjwt>=2.9,<3",
    "python-multipart>=0.0.12,<1",
    "python-docx>=1.1,<2",
    "qdrant-client>=1.12,<2",
    "redis>=5,<7",
    "sentry-sdk[fastapi]>=2,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "temporalio>=1.7,<2",
    "tiktoken>=0.8,<1",
    "unstructured>=0.16,<1",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.7,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

